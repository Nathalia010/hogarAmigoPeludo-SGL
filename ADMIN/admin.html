<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../../components/navbar-footer/navbar-footer.css">
    <link rel="stylesheet" href="style.css">
    <title>ADMIN</title>
</head>
<body>
    <main class="admin-page">

    <section class="admin-section">

        <div class="container">

            <div class="section-header text-center mb-5">

                <span class="section-badge">
                    Panel administrador
                </span>

                <h1>
                    Solicitudes de adopción
                </h1>

                <p>
                    Gestiona las solicitudes realizadas por los usuarios.
                </p>

            </div>

            <!-- Filtros -->

            <div class="admin-card mb-4">

                <div class="row g-3 align-items-end">

                    <div class="col-md-4">

                        <label class="form-label">
                            Buscar por fecha
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="filtroFecha">

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">
                            Estado
                        </label>

                        <select
                            class="form-select"
                            id="filtroEstado">

                            <option value="">
                                Todos
                            </option>

                            <option>
                                Solicitud llenada
                            </option>

                            <option>
                                En revisión
                            </option>

                            <option>
                                Aceptada
                            </option>

                            <option>
                                Negada
                            </option>

                            <option>
                                Coordinando entrega
                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <div class="row">

                <!-- TABLA -->

                <div class="col-lg-7">

                    <div class="admin-card">

                        <div class="table-responsive">

                            <table class="table align-middle">

                                <thead>

                                    <tr>

                                        <th>Solicitante</th>

                                        <th>Mascota</th>

                                        <th>Estado</th>

                                        <th></th>

                                    </tr>

                                </thead>

                                <tbody id="tablaSolicitudes">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

                <!-- DETALLE -->

                <div class="col-lg-5">

                    <div class="admin-card" id="panelDetalle">

                        <div class="text-center py-5 text-muted">

                            <i class="fa-solid fa-paw fa-3x mb-3"></i>

                            <h5>

                                Selecciona una solicitud

                            </h5>

                            <p>

                                Aquí aparecerá toda la información.

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>




<script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>

    <script
      src="./components/navbar-footer/navbar-footer.js"
      type="module"
    ></script>
    <script src="script.js" type="module"></script>
</body>
</html>
