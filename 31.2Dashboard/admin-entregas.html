<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Administración de entregas de Hogar Amigo Peludo" />
    <title>Entregas | Hogar Amigo Peludo</title>
    <link rel="stylesheet" href="../components/navbar-footer/navbar-footer.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin-entregas.css" />
    <link rel="stylesheet" href="css/dashboard.css" />

  </head>

  <body>
     <nav-bar></nav-bar>
     <div class="admin-shell">
      <nav-admin active="entregas"></nav-admin>

      <div class="admin-workspace">
        <header class="admin-topbar">
          <button
            class="btn sidebar-toggle"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#adminSidebar"
            aria-controls="adminSidebar"
            aria-label="Abrir menú lateral"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <small>Panel administrador</small>
            <h1>Gestión de entregas</h1>
          </div>
        </header>

        <main class="container-fluid py-4">
          <div class="deliveries-layout">
            <section class="delivery-list-column">
              <div class="card border-0 shadow-sm delivery-card">
                <div class="card-body p-3 p-lg-4">
                  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                    <div>
                      <span class="section-kicker">LOGÍSTICA</span>
                      <h2 class="h4 mb-1">Entregas</h2>
                      <p class="text-secondary mb-0">Consulta y actualiza las entregas coordinadas.</p>
                    </div>
                    <span class="badge rounded-pill text-bg-light" id="deliveryTotal">0 entregas</span>
                  </div>

                  <form class="row g-2 mb-4" id="deliveryFilters">
                    <div class="col-12 col-lg">
                      <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input
                          class="form-control"
                          id="searchDelivery"
                          type="search"
                          placeholder="Buscar mascota, adoptante o dirección"
                        />
                      </div>
                    </div>
                    <div class="col-6 col-md-3 col-lg-2">
                      <select class="form-select" id="statusFilter" aria-label="Filtrar por estado">
                        <option value="">Todos los estados</option>
                        <option value="No enviado">No enviado</option>
                        <option value="De camino">De camino</option>
                        <option value="Recibido">Recibido</option>
                      </select>
                    </div>
                    <div class="col-6 col-md-3 col-lg-2">
                      <select class="form-select" id="carrierFilter" aria-label="Filtrar por transportista">
                        <option value="">Todos los transportistas</option>
                      </select>
                    </div>
                    <div class="col-8 col-md-4 col-lg-2">
                      <input class="form-control" id="dateFilter" type="date" aria-label="Filtrar por fecha" />
                    </div>
                    <div class="col-4 col-md-2 col-lg-auto">
                      <button class="btn btn-outline-secondary w-100" id="clearFilters" type="button">
                        <i class="fa-solid fa-eraser"></i>
                        <span class="d-none d-md-inline">Limpiar</span>
                      </button>
                    </div>
                  </form>

                  <div class="table-responsive">
                    <table class="table delivery-table align-middle mb-0">
                      <thead>
                        <tr>
                          <th>Mascota</th>
                          <th>Adoptante</th>
                          <th>Dirección</th>
                          <th>Fecha de entrega</th>
                          <th>Transportista</th>
                          <th>Estado</th>
                          <th class="text-end">Acciones</th>
                        </tr>
                      </thead>
                      <tbody id="deliveryTable"></tbody>
                    </table>
                  </div>

                  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 pt-3">
                    <small class="text-secondary" id="deliveryRange"></small>
                    <nav aria-label="Paginación de entregas">
                      <ul class="pagination pagination-sm mb-0" id="deliveryPagination"></ul>
                    </nav>
                  </div>
                </div>
              </div>
            </section>

            <aside
              class="delivery-detail offcanvas-xl offcanvas-end"
              id="deliveryDetail"
              tabindex="-1"
              aria-labelledby="deliveryDetailTitle"
            >
              <div class="offcanvas-header d-xl-none">
                <h2 class="offcanvas-title h5" id="deliveryDetailTitle">Detalle de la entrega</h2>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
              </div>
              <div class="offcanvas-body p-0 d-block" id="deliveryDetailContent"></div>
            </aside>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div class="toast align-items-center border-0" id="deliveryToast" role="status" aria-live="polite">
        <div class="d-flex">
          <div class="toast-body" id="deliveryToastMessage">Entrega actualizada.</div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../components/nav-admin/nav-admin.js" type="module"></script>
    <script src="scripts/admin-entregas.js" type="module"></script>



    <script src="scripts/menuPerfil.js" defer></script>
    <script src="scripts/script-adminDashboard.js" type="module"></script>
    <script src="../components/navbar-footer/navbar-footer.js" type="module"></script>


  </body>
</html>
