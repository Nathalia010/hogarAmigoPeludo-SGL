<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contactenos</title>
    <!-- navbar-footer style -->

      href="../components/navbar-footer/navbar-footer.css"
    />

    <link rel="stylesheet" href="css/style.css"/>

    <link

    />

    />
  </head>

  <body>
    <nav-bar></nav-bar>

    <main class="admin-page">
      <section class="admin-section">
        <div class="container">
          <div class="section-header text-center">
            <span class="section-badge">Administrador</span>
            <h1>Crear publicación de adopción</h1>
            <p>
              Registra los animalitos que estarán disponibles en el catálogo.
            </p>
          </div>

          <div class="row g-4">
            <div class="col-lg-5">
              <form id="formPublicacion" class="admin-card">
                <h2 class="section-title">Nueva publicación</h2>

                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input
                    type="text"
                    id="nombre"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Especie</label>
                  <select id="especie" class="form-select" required>
                    <option value="">Seleccione</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                    <option value="Otro">Otro</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label">Edad</label>
                  <input
                    type="text"
                    id="edad"
                    class="form-control"
                    placeholder="Ej: 2 años"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Sexo</label>
                  <select id="sexo" class="form-select" required>
                    <option value="">Seleccione</option>
                    <option value="Macho">Macho</option>
                    <option value="Hembra">Hembra</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label">Tamaño</label>
                  <select id="tamano" class="form-select" required>
                    <option value="">Seleccione</option>
                    <option value="Pequeño">Pequeño</option>
                    <option value="Mediano">Mediano</option>
                    <option value="Grande">Grande</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label">Imagen URL</label>
                  <input
                    type="url"
                    id="imagen"
                    class="form-control"
                    placeholder="https://..."
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Descripción</label>
                  <textarea
                    id="descripcion"
                    class="form-control"
                    rows="4"
                    required
                  ></textarea>
                </div>

                <button type="submit" class="btn-submit w-100">
                  Guardar publicación
                </button>
              </form>
            </div>

            <div class="col-lg-7">
              <div class="admin-card">
                <h2 class="section-title">Listado de publicaciones</h2>

                <div class="table-responsive">
                  <table class="table align-middle">
                    <thead>
                      <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Especie</th>
                        <th>Edad</th>
                        <th>Estado</th>
                      </tr>
                    </thead>
                    <tbody id="tablaPublicaciones"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <page-footer> </page-footer>
    <!-- navbar-footer script -->
    <footer></footer>
    <script src="./scripts/scripts.js"></script>
    <script

    ></script>
    <!-- navbar-footer script -->
    <script

  </body>
</html>
