<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>adoptar</title>
    <!-- navbar-footer style -->
    <link
      rel="stylesheet"
      href="../components/navbar-footer/navbar-footer.css"
    />
    <!--Styles-->
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/popup.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <nav-bar></nav-bar>
    <main class="contact-section">
      <div class="container-fluid">
        <div class="row g-4 justify-content-center align-items-stretch">
          <!-- Formulario -->
          <div class="col-lg-7 col-xl-6">
            <div class="contact-card">
              <h2 class="section-title">Datos de propietario</h2>

              <form id="formContacto">
                <div class="row g-4">
                  <!-- SECCIÓN 1: DATOS PERSONALES -->
                  <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input
                      type="text"
                      id="nombre"
                      name="nombre"
                      class="form-control"
                      placeholder="Tu nombre"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <input
                      type="text"
                      id="apellidos"
                      name="apellidos"
                      class="form-control"
                      placeholder="Tus apellidos"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="documento" class="form-label"
                      >Documento de Identidad</label
                    >
                    <input
                      type="text"
                      id="documento"
                      name="documento"
                      class="form-control"
                      placeholder="C.C. / DNI"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="edad" class="form-label"
                      >Edad (Mínimo 18 años)</label
                    >
                    <input
                      type="number"
                      id="edad"
                      name="edad"
                      class="form-control"
                      min="18"
                      placeholder="Tu edad"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="email" class="form-label"
                      >Correo electrónico</label
                    >
                    <input
                      type="email"
                      id="email"
                      name="email"
                      class="form-control"
                      placeholder="correo@ejemplo.com"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input
                      type="tel"
                      id="telefono"
                      name="telefono"
                      class="form-control"
                      placeholder="3001234567"
                      required
                    />
                  </div>

                  <!-- SECCIÓN 2: UBICACIÓN Y VIVIENDA -->
                  <div class="col-md-6">
                    <label for="pais" class="form-label">País</label>
                    <select id="pais" name="pais" class="form-select" required>
                      <option selected>Colombia</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="estado" class="form-label"
                      >Ciudad / Municipio</label
                    >
                    <select
                      id="estado"
                      name="estado"
                      class="form-select"
                      required
                    >
                      <option value="" selected disabled>
                        Selecciona una opción
                      </option>
                      <option>Bogota</option>
                      <option>Medellin</option>
                      <option>Barranquilla</option>
                      <option>Cali</option>
                      <option>Cartagena</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="tipo_vivienda" class="form-label"
                      >Tipo de vivienda</label
                    >
                    <select
                      id="tipo_vivienda"
                      name="tipo_vivienda"
                      class="form-select"
                      required
                    >
                      <option value="" selected disabled>
                        Selecciona una opción
                      </option>
                      <option>Casa</option>
                      <option>Apartamento</option>
                      <option>Finca / Casa de campo</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="regimen_vivienda" class="form-label"
                      >La vivienda es</label
                    >
                    <select
                      id="regimen_vivienda"
                      name="regimen_vivienda"
                      class="form-select"
                      required
                    >
                      <option value="" selected disabled>
                        Selecciona una opción
                      </option>
                      <option>Propia</option>
                      <option>Arrendada (Tengo permiso para mascotas)</option>
                      <option>Familiar</option>
                    </select>
                  </div>

                  <!-- SECCIÓN 3: ENTORNO Y EXPERIENCIA -->
                  <div class="col-md-6">
                    <label for="horas_sola" class="form-label"
                      >Horas al día que estará sola la mascota</label
                    >
                    <input
                      type="number"
                      id="horas_sola"
                      name="horas_sola"
                      class="form-control"
                      min="0"
                      max="24"
                      placeholder="Ej: 4"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="otras_mascotas" class="form-label"
                      >¿Tiene otras mascotas actualmente?</label
                    >
                    <select
                      id="otras_mascotas"
                      name="otras_mascotas"
                      class="form-select"
                      required
                    >
                      <option>No, no tengo</option>
                      <option>Sí, perros</option>
                      <option>Sí, gatos</option>
                      <option>Sí, otros animales</option>
                    </select>
                  </div>

                  <div class="col-md-12">
                    <label for="motivo" class="form-label"
                      >¿Por qué deseas adoptar a esta mascota?</label
                    >
                    <textarea
                      id="motivo"
                      name="motivo"
                      rows="3"
                      class="form-control"
                      placeholder="Escribe brevemente tus razones aquí..."
                      required
                    ></textarea>
                  </div>

                  <div class="col-md-12">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="compromiso"
                        name="compromiso"
                        value="si"
                        required
                      />
                      <label
                        class="form-check-label small text-muted"
                        for="compromiso"
                      >
                        Me comprometo a asumir los gastos de alimentación,
                        veterinaria y a dar un trato digno al animal.
                      </label>
                    </div>
                  </div>

                  <div class="col-md-12">
                    <button type="submit" class="btn-submit">
                      Enviar Solicitud de Adopción
                    </button>
                  </div>
                </div>

                <p id="respuesta" class="mt-3"></p>
              </form>
            </div>
          </div>
          <!-- Información de contacto -->
          <div class="col-lg-5 col-xl-4">
            <div class="contact-card contact-info-card">
              <h2 class="section-title">Información de la mascota</h2>

              <div class="pet-image">
                <img
                  id="imagenMascota"
                  src=""
                  alt="Mascota en adopción"
                  class="img-fluid"
                />
              </div>

              <div class="contact-item">
                <div class="contact-icon">🐾</div>

                <div>
                  <h3>Nombre</h3>

                  <p>
                    <span id="nombreMascota"></span>
                    <span id="estadoMascota" class="badge"></span>
                  </p>
                </div>
              </div>

              <div class="contact-item">
                <div class="contact-icon">🎂</div>

                <div>
                  <h3>Edad y sexo</h3>

                  <p id="edadSexoMascota"></p>
                </div>
              </div>

              <div class="contact-item">
                <div class="contact-icon">📏</div>

                <div>
                  <h3>Tamaño</h3>

                  <p id="tamanoMascota"></p>
                </div>
              </div>

              <div class="contact-item">
                <div class="contact-icon">🐶</div>

                <div>
                  <h3>Especie</h3>

                  <p id="especieMascota"></p>
                </div>
              </div>

              <div class="contact-item">
                <div class="contact-icon">⚥</div>

                <div>
                  <h3>Sexo</h3>

                  <p id="sexoMascota"></p>
                </div>
              </div>

              <div class="contact-item">
                <div class="contact-icon">❤️</div>

                <div>
                  <h3>Descripción</h3>

                  <p id="descripcionMascota"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <page-footer> </page-footer>

    <!-- Popup de cuenta / inicio de sesión -->
    <div class="modal fade" id="modalCuenta" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content popup-cuenta">
          <div class="modal-header border-0">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body" id="modalCuentaBody"></div>
        </div>
      </div>
    </div>

    <!-- navbar-footer script -->

    <script src="scripts.js" type="module"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>
    <!-- navbar-footer script -->
    <script
      src="../components/navbar-footer/navbar-footer.js"
      type="module"
    ></script>
  </body>
</html>
